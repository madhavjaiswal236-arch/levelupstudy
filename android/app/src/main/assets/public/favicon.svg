<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- Cyan 400 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue 500 -->
    </linearGradient>
    <linearGradient id="gradAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- Purple 500 -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- Indigo 500 -->
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="#0f172a" /> <!-- Slate 900 background for a sleek app icon look -->

  <!-- Outer diamond/glow shape -->
  <path d="M256 64 L448 256 L256 448 L64 256 Z" fill="none" stroke="url(#grad)" stroke-width="32" stroke-linejoin="round" />

  <!-- Inner ascending arrow/graph symbolizing leveling -->
  <path d="M160 320 L224 256 L288 320 L384 192" fill="none" stroke="url(#gradAccent)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow head -->
  <path d="M384 192 L384 272 M384 192 L304 192" fill="none" stroke="url(#gradAccent)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
</svg>
