<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A gamified, AI-powered productivity ecosystem for high-performance students." />
    <meta property="og:title" content="LevelUp Study" />
    <meta property="og:description" content="A gamified, AI-powered productivity ecosystem for high-performance students." />
    <title>LevelUp Study</title>
    <script>
      // Filter Vite HMR WebSocket connection errors in dev preview iframe (HMR is disabled in this environment)
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (firstArg && typeof firstArg === 'string' && (firstArg.includes('[vite] failed to connect to websocket') || firstArg === '[vite]')) {
            return;
          }
          if (firstArg === '[vite]' && arguments[1] && (String(arguments[1]).includes('websocket') || String(arguments[1]).includes('WebSocket') || String(arguments[1]).includes('failed to connect'))) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
                <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="LevelUp" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>

  </body>
</html>
